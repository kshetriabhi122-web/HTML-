<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timepass</title>
    <style>
        @font-face {
            font-family: "Ghost";
            src: url(fonts/Ghost\ Mortar\ Demo.ttf);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
            background-color: #222;
        }

        .First-Page {
            width: 100%;
            height: 100vh;
            background-image: url('bg.webp');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: rgb(186, 70, 70);
            text-align: center;
        }

        h1 {
            margin-bottom: 15px;
            font-family: "Ghost";
        }

        
        #message {
            margin-top: 25px;
            min-height: 40px; 
            color: #4dfd54; 
            font-size: 24px;
        }

        .button {
            margin-top: 20px;
        }

        button {
            padding: 10px 25px;
            margin: 0 10px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: white;
            color: black;
            font-weight: bold;
        }

        button:hover {
            background-color: #ddd;
        }
        #nBtn {position: relative;transition: 0.2s ease;}
        .Second-Page {
            height: 100vh;
            width: 100vw;
            display: none;
            margin: 0%;
            padding: 0;
            overflow: hidden;
            background-image: url(2bg.jpg);
            background-size: cover;
             background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }
        marquee {font-size: 40px;font-family: "Ghost";}
    </style>
</head>
<body>

    <div  id= "first" class="First-Page">
        <h1>Hello Welcome ....</h1>
        <h1>Are You Interested?</h1>
        
        <div class="button">
            <button id="yBtn">Yes</button>
            <button id="nBtn">No</button>
        </div>

        <h2 id="message"></h2>
    </div>
    <div id="second" class="Second-Page">
        <marquee>Hello Buddy Happy Halloween</marquee>
    </div>

    <script>
        const yesButton = document.getElementById('yBtn');
        const noButton = document.getElementById('nBtn');
        const messageDisplay = document.getElementById('message');
        const one = document.getElementById("first")
        const two = document.getElementById("second")

        yesButton.onclick = function() {
            one.style.display ="none";
            two.style.display ="flex";            
        };

        noButton.addEventListener("mouseover", function() {

    const maxX = window.innerWidth - noButton.offsetWidth;
    const maxY = window.innerHeight - noButton.offsetHeight;

    const randomX = Math.random() * maxX;
    const randomY = Math.random() * maxY;

    noButton.style.position = "fixed";
    noButton.style.left = randomX + "px";
    noButton.style.top = randomY + "px";

});
    </script>

</body>
</html>
